[project]
name = "candela"
version = "0.1.0"
description = "Add your description here"
requires-python = ">=3.14"
dependencies = [
    "aiosqlite==0.22.1",
    "alembic==1.20.0",
    "apscheduler==3.11.3",
    "asyncpg==0.32.0",
    "fastapi==0.143.0",
    "httpx==0.28.1",
    "jinja2==3.1.6",
    "pydantic-settings==2.15.0",
    "python-multipart==0.0.32",
    "itsdangerous==2.2.0",
    "uvicorn[standard]==0.54.0",
]

[dependency-groups]
dev = [
    "coverage==7.16.2",
    "prek==0.5.5",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pytest-asyncio==1.4.0",
    "ruff==0.17.0",
    "pyrefly==1.3.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["candela"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.pyrefly]
python-version = "3.14.0"

[tool.coverage.run]
source = ["candela"]
omit = ["tests/*"]
